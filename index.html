<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орбита — трекер дней</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{--bg:#eceef6;--sf:#fff;--sf2:#f3f4fa;--tx:#171a2e;--mu:#757a96;--bd:#dfe2ef;--ac:#5b4bff;--lime:#b8e83a;--c0:#3b82f6;--c1:#a855f7;--c2:#10b981;--c3:#f59e0b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--sf:#171a30;--sf2:#1e2240;--tx:#eceefb;--mu:#8b90b3;--bd:#2a2f52;--ac:#8479ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--sf:#171a30;--sf2:#1e2240;--tx:#eceefb;--mu:#8b90b3;--bd:#2a2f52;--ac:#8479ff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Onest,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{padding:22px 14px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font:700 18px Unbounded,sans-serif;display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ac);position:relative}
.brand i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--lime);right:-4px;top:1px}
.nv{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;color:var(--mu);text-align:left;font-weight:500}
.nv:hover{background:var(--sf2)}.nv.on{background:var(--ac);color:#fff}
.sync{font-size:12px;padding:4px 12px}
.sp{flex:1}.mini{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px}
.mini b{font:700 22px Unbounded}.mu{color:var(--mu)}
.meter{height:6px;border-radius:9px;background:var(--sf2);overflow:hidden;margin-top:8px}.meter u{display:block;height:100%;background:var(--ac);border-radius:9px}
main{padding:28px 34px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
h1{font:700 32px/1.1 Unbounded,sans-serif;margin:2px 0 0;letter-spacing:-.02em}
.nav{display:flex;gap:6px}.nav button{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:7px 13px}.nav button:hover{border-color:var(--ac)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px}
.hero{display:flex;gap:20px;align-items:center;margin-bottom:14px}.hero b{font:700 20px Unbounded;display:block}
.ring text{font:700 17px Unbounded;fill:var(--tx)}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;background:var(--sf);border:1px dashed var(--bd);border-radius:13px;padding:11px 14px}
.add input:focus{border-style:solid;border-color:var(--ac);outline:0}
select{background:var(--sf);border:1px solid var(--bd);border-radius:13px;padding:0 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:13px;margin-bottom:6px}
.row.dn span{color:var(--mu);text-decoration:line-through}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--bd);display:grid;place-items:center;font-size:13px;color:#171a2e;flex:none}
.dn .ck{background:var(--lime);border-color:var(--lime)}
.row span{flex:1}.row em{font-style:normal;font-size:12px;padding:2px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.x{color:var(--mu);font-size:18px;opacity:.5}.x:hover{opacity:1}
aside .card{margin-bottom:14px}aside h3,.card h3{font:500 13px Unbounded;margin:0 0 12px}
.moods{display:flex;gap:6px}.moods button{flex:1;font-size:20px;padding:6px 0;border-radius:11px;background:var(--sf2);filter:grayscale(1);opacity:.6}
.moods .on{filter:none;opacity:1;outline:2px solid var(--ac)}
textarea{width:100%;min-height:90px;resize:vertical;background:var(--sf2);border:0;border-radius:12px;padding:10px}
.hb{display:flex;align-items:center;gap:10px;padding:5px 0}.hb .ck{width:20px;height:20px}.hb.dn .ck{background:var(--ac);border-color:var(--ac);color:#fff}
.wk{display:flex;gap:6px;align-items:flex-end;height:70px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.wk u{display:block;background:var(--ac);border-radius:6px;min-height:4px;margin-bottom:4px;opacity:.85}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .dw{text-align:center;color:var(--mu);font-size:12px}
.cell{aspect-ratio:1.15;border-radius:13px;border:1px solid var(--bd);background:color-mix(in srgb,var(--ac) var(--p),var(--sf));padding:7px 9px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:600}
.cell small{font-weight:400;font-size:11px;opacity:.8}.cell.now{outline:2px solid var(--lime)}
.cell[style*="--p:0%"]{color:var(--tx)}.cell:hover{border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stats .card b{font:700 26px Unbounded;display:block;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.br{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.br span:first-child{width:72px}.br .meter{flex:1;margin:0;height:9px}
.ht{overflow-x:auto}.hr{display:flex;align-items:center;gap:3px;margin-bottom:8px;min-width:max-content}
.hr .nm{width:150px;font-weight:500;flex:none}.hr .st{width:70px;text-align:right;color:var(--mu);font-size:12px;flex:none}
.hr .x{margin-left:8px;flex:none}
.dt{width:17px;height:17px;border-radius:5px;background:var(--sf2);flex:none}.dt.on{background:var(--ac)}.dt.fu{opacity:.35}
button{transition:transform .15s ease,background .2s,border-color .2s}
button:active{transform:scale(.93)}
.cell,.row,.card{transition:transform .2s ease,border-color .2s,box-shadow .2s,opacity .17s}
.cell:hover{transform:translateY(-3px);box-shadow:0 8px 18px -10px var(--ac)}
.row:hover{transform:translateX(3px);border-color:var(--ac)}
.ck{transition:background .2s,border-color .2s}
.ck.pop,.moods button.pop,.dt.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.enter>*{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.in{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.row.out,.hr.out{opacity:0;transform:translateX(24px) scale(.97);pointer-events:none}
.ring .arc{animation:draw .6s cubic-bezier(.2,.8,.2,1)}
@keyframes draw{from{stroke-dasharray:var(--f) var(--t)}}
.ring .dot{animation:dot .6s cubic-bezier(.2,.8,.2,1)}
@keyframes dot{from{stroke-dashoffset:var(--g)}}
.refl{margin-top:14px}.refl textarea{min-height:160px}.refl .sv{font-size:12px;display:block;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{background:var(--sf2);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-size:13px}.chip:hover{border-color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--bd);padding:12px}
.brand{padding:0 10px 0 4px}.mini,.sp{display:none}main{padding:18px 14px}.cols,.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}h1{font-size:25px}}
</style></head><body>
<div class="shell"><nav class="side" id="side"></nav><main id="app"></main></div>
<script>
const K='orbit-v2',MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],DF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'],
CATS=[['Работа','var(--c0)'],['Учёба','var(--c1)'],['Здоровье','var(--c2)'],['Дом','var(--c3)']],
MOODS=['😞','😕','😐','🙂','🤩'];
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)},
esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=iso(new Date());let S,view='today',day=TODAY,ym=day.slice(0,7);
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tasks)seed();
if(S.ts==null)S.ts=1;
const SY={ok:'☁ Синхронизировано',busy:'⟳ Синхронизация…',local:'Только на этом устройстве',err:'Нет связи, сохранено на устройстве'};
let CID=Math.random().toString(36).slice(2),ref=null,syncSt='local',pushT=null,pend=null,rsC=false,syncMsg='';
function persist(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function setSt(v){if(syncSt!=v){syncSt=v;side();if(view=='sync'&&!typing())render()}}
function save(){S.ts=Date.now();persist();push()}
function push(){if(!ref&&!GH())return;setSt('busy');clearTimeout(pushT);pushT=setTimeout(async()=>{pushT=null;try{if(GH())await ghPush();else await ref.set({json:JSON.stringify(S),ts:S.ts,from:CID});setSt('ok')}catch(e){fail(e)}},700)}
function seed(){S={tasks:{},habits:[],hab:{},notes:{},mood:{},id:100,ts:0};persist()}
const pct=k=>{const L=S.tasks[k]||[];return L.length?L.filter(t=>t.d).length/L.length:null};
let lastP=0;
function ring(p){const c=2*Math.PI*38,f=c*lastP/100;lastP=p;return `<svg class="ring" width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="none" stroke="var(--sf2)" stroke-width="10"/><circle cx="48" cy="48" r="38" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" class="arc" style="--f:${f};--t:${c}" transform="rotate(-90 48 48)"/><circle cx="48" cy="48" r="38" fill="none" stroke="var(--lime)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 ${c}" stroke-dashoffset="${-c*p/100+1}" class="dot" style="--g:${-f+1}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle">${p}%</text></svg>`}
function side(){
 const [y,m]=TODAY.split('-').map(Number),n=new Date(y,m,0).getDate();let s=0,c=0;
 for(let d=1;d<=n;d++){const p=pct(y+'-'+pad(m)+'-'+pad(d));if(p!=null){s+=p;c++}}
 const a=c?Math.round(s/c*100):0;
 $('side').innerHTML=`<div class="brand"><i></i>Орбита</div>`+[['today','◉','Сегодня'],['month','▦','Месяц и итоги'],['habits','↻','Привычки'],['sync','☁','Синхронизация']].map(v=>`<button class="nv ${view==v[0]?'on':''}" data-a="v" data-v="${v[0]}"><span>${v[1]}</span>${v[2]}</button>`).join('')+
 `<div class="sp"></div><div class="mini"><span class="mu">${MON[m-1]}, в среднем</span><br><b>${a}%</b><div class="meter"><u style="width:${a}%"></u></div></div><div class="sync mu">${SY[syncSt]}</div><button class="nv" data-a="th"><span>◐</span>Тема</button><button class="nv" data-a="rs"><span>⌫</span>${rsC?'Точно очистить всё?':'Очистить данные'}</button>`}
const $=id=>document.getElementById(id);
function row(t){return `<div class="row ${t.d?'dn':''}"><button class="ck" data-a="tg" data-i="${t.id}" aria-label="Отметить">${t.d?'✓':''}</button><span>${esc(t.t)}</span><em style="--c:${CATS[t.c][1]}">${CATS[t.c][0]}</em><button class="x" data-a="del" data-i="${t.id}" aria-label="Удалить">×</button></div>`}
function vToday(){
 const L=S.tasks[day]||[],dn=L.filter(t=>t.d).length,p=L.length?Math.round(dn/L.length*100):0,d=parse(day);
 const wk=[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(x.getDate()-6+i);const q=pct(iso(x));return `<div><u style="height:${Math.round((q||0)*52)}px"></u>${DOW[(x.getDay()+6)%7]}</div>`}).join('');
 return `<div class="hd"><div><span class="mu">${DF[(d.getDay()+6)%7]}</span><h1>${d.getDate()} ${MONG[d.getMonth()]}</h1></div><div class="nav"><button data-a="pv">‹</button><button data-a="td">Сегодня</button><button data-a="nx">›</button></div></div>
 <div class="cols"><section><div class="card hero">${ring(p)}<div><b>${dn} из ${L.length}</b><span class="mu">задач выполнено</span></div></div>
 <div class="add"><input id="ti" placeholder="Новая задача, затем Enter" autocomplete="off"><select id="tc" aria-label="Категория">${CATS.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></div>
 ${L.map(row).join('')||'<p class="mu">На этот день задач нет. Добавьте первую выше.</p>'}</section>
 <aside><div class="card"><h3>Настроение</h3><div class="moods">${MOODS.map((m,i)=>`<button class="${S.mood[day]==i?'on':''}" data-a="md" data-i="${i}">${m}</button>`).join('')}</div></div>
 <div class="card"><h3>Привычки дня</h3>${S.habits.map(h=>{const o=S.hab[h.id+'|'+day];return `<div class="hb ${o?'dn':''}"><button class="ck" data-a="hb" data-h="${h.id}" data-k="${day}">${o?'✓':''}</button>${esc(h.n)}</div>`}).join('')||'<p class="mu">Добавьте привычки в разделе «Привычки»</p>'}</div>
 <div class="card"><h3>Заметка дня</h3><textarea id="nt" placeholder="Что получилось, что перенести…">${esc(S.notes[day]||'')}</textarea></div>
 <div class="card"><h3>Последние 7 дней</h3><div class="wk">${wk}</div></div></aside></div>`}
function vMonth(){
 const[y,m]=ym.split('-').map(Number),off=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate();
 let cells=DOW.map(d=>`<div class="dw">${d}</div>`).join('')+'<i></i>'.repeat(off),tot=0,dn=0,sum=0,cnt=0,best=null,st=0,bs=0,cat=[0,0,0,0],ct=[0,0,0,0],wk=[];
 for(let d=1;d<=n;d++){const k=y+'-'+pad(m)+'-'+pad(d),L=S.tasks[k]||[],x=L.filter(t=>t.d).length,p=L.length?x/L.length:null,w=Math.floor((off+d-1)/7);
  wk[w]=wk[w]||[0,0];wk[w][0]+=x;wk[w][1]+=L.length;
  if(L.length){tot+=L.length;dn+=x;sum+=p;cnt++;if(!best||p>best[1])best=[d,p];L.forEach(t=>{ct[t.c]++;if(t.d)cat[t.c]++});if(p>=.7){st++;bs=Math.max(bs,st)}else st=0}else st=0;
  cells+=`<button class="cell ${k==TODAY?'now':''}" data-a="go" data-k="${k}" style="--p:${p==null?0:Math.round(p*85)}%">${d}<small>${p==null?'':Math.round(p*100)+'%'}</small></button>`}
 const bar=(l,a,b)=>`<div class="br"><span>${l}</span><div class="meter"><u style="width:${b?a/b*100:0}%"></u></div><span>${a}/${b}</span></div>`;
 return `<div class="hd"><div><span class="mu">Итоги месяца</span><h1>${MON[m-1]} ${y}</h1></div><div class="nav"><button data-a="mp">‹</button><button data-a="mn">›</button></div></div>
 <div class="card"><div class="cal">${cells}</div></div>
 <div class="stats"><div class="card"><span class="mu">Выполнено</span><b>${dn}/${tot}</b></div><div class="card"><span class="mu">Средний день</span><b>${cnt?Math.round(sum/cnt*100):0}%</b></div><div class="card"><span class="mu">Лучшая серия</span><b>${bs} дн.</b></div><div class="card"><span class="mu">Лучший день</span><b>${best?best[0]+' '+MONG[m-1].slice(0,3):'—'}</b></div></div>
 <div class="two"><div class="card"><h3>По неделям</h3>${wk.map((w,i)=>bar((i+1)+' неделя',w[0],w[1])).join('')}</div><div class="card"><h3>По категориям</h3>${CATS.map((c,i)=>bar(c[0],cat[i],ct[i])).join('')}</div></div>
 <div class="card refl"><h3>Мысли о месяце</h3><div class="chips">${['Что получилось','Что мешало','Чему научился','План на следующий месяц'].map(t=>`<button class="chip" data-a="pr" data-t="${t}">+ ${t}</button>`).join('')}</div><textarea id="mr" placeholder="Подведите итоги: что удалось, что хочется изменить…">${esc((S.refl||{})[ym]||'')}</textarea><span class="mu sv">Сохраняется автоматически</span></div>`}
function vHabits(){
 const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate();
 const rows=S.habits.map(h=>{let c=0,dots='';for(let d=1;d<=n;d++){const k=y+'-'+pad(m)+'-'+pad(d),o=S.hab[h.id+'|'+k];if(o)c++;dots+=`<button class="dt ${o?'on':''} ${k>TODAY?'fu':''}" data-a="hb" data-h="${h.id}" data-k="${k}" title="${d}"></button>`}
  return `<div class="hr"><span class="nm">${esc(h.n)}</span>${dots}<span class="st">${c}/${n}</span><button class="x" data-a="dh" data-h="${h.id}" aria-label="Удалить привычку" title="Удалить привычку">×</button></div>`}).join('');
 return `<div class="hd"><div><span class="mu">Привычки</span><h1>${MON[m-1]} ${y}</h1></div><div class="nav"><button data-a="mp">‹</button><button data-a="mn">›</button></div></div>
 <div class="card ht">${rows||'<p class="mu">Привычек пока нет.</p>'}</div><div class="add" style="margin-top:12px"><input id="hi" placeholder="Новая привычка, затем Enter" autocomplete="off"></div>`}
function render(anim){side();const A=$('app');A.innerHTML=view=='today'?vToday():view=='month'?vMonth():view=='sync'?vSync():vHabits();if(anim){A.classList.remove('enter');void A.offsetWidth;A.classList.add('enter')}}
function shift(k,v){const d=parse(k);d.setDate(d.getDate()+v);return iso(d)}
function ymShift(v){const[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+v,1);ym=d.getFullYear()+'-'+pad(d.getMonth()+1)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
 if(a=='v'){view=D.v;if(view!='today')ym=day.slice(0,7)}
 else if(a=='tg'){const t=S.tasks[day].find(t=>t.id==D.i);t.d=!t.d}
 else if(a=='del'){b.closest('.row').classList.add('out');setTimeout(()=>{S.tasks[day]=S.tasks[day].filter(t=>t.id!=D.i);save();render()},170);return}
 else if(a=='pv')day=shift(day,-1);else if(a=='nx')day=shift(day,1);else if(a=='td')day=TODAY;
 else if(a=='md')S.mood[day]=S.mood[day]==D.i?undefined:+D.i;
 else if(a=='hb'){const k=D.h+'|'+D.k;S.hab[k]?delete S.hab[k]:S.hab[k]=1}
 else if(a=='dh'){b.closest('.hr').classList.add('out');setTimeout(()=>{S.habits=S.habits.filter(h=>h.id!=D.h);Object.keys(S.hab).forEach(k=>{if(k.split('|')[0]==D.h)delete S.hab[k]});save();render()},170);return}
 else if(a=='mp')ymShift(-1);else if(a=='mn')ymShift(1);
 else if(a=='rs'){if(!rsC){rsC=true;setTimeout(()=>{rsC=false;side()},4000)}else{rsC=false;S={tasks:{},habits:[],hab:{},notes:{},mood:{},id:100,ts:0}}}
 else if(a=='gs'){const v=$('gt').value.trim();if(!v)return;localStorage.setItem('orbit-gh',JSON.stringify({t:v}));setSt('busy');render();startGH();return}
