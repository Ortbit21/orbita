<style>
:root{--bg:#eceef6;--sf:#fff;--sf2:#f3f4fa;--tx:#171a2e;--mu:#757a96;--bd:#dfe2ef;--ac:#5b4bff;--lime:#b8e83a;--c0:#3b82f6;--c1:#a855f7;--c2:#10b981;--c3:#f59e0b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.sc::-webkit-scrollbar{display:none}

.nav .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.bars{display:flex;gap:3px;height:clamp(176px,22vw,300px);align-items:flex-end}
.bc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;align-items:center;padding:0;border-radius:6px}
.bc u{display:block;width:100%;border-radius:5px 5px 2px 2px;transition:height .25s}

.slp .sh b.m{font-size:32px}
.tps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tp{border-radius:18px;border:2px solid var(--bd);padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative}

.stk{margin-top:6px;font-size:13px;font-weight:600;color:var(--ac)}
.cv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px}
.rp{color:var(--mu);font-size:15px;padding:0 4px}.rp:hover{color:var(--ac)}
.add{flex-wrap:wrap}.add input{min-width:150px}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}

.brand{padding:0 10px 0 4px}.mini,.sp{display:none}main{padding:18px 14px}.cols,.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}h1{font-size:25px}}
